<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原神クイズ - Genshin Impact Quiz</title>
  <meta name="description" content="原神の知識を試す4択クイズゲーム。キャラクター、元素、ストーリーなど幅広い問題に挑戦しよう！">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #e2b44d;
      --gold-light: #f5d88e;
      --gold-dark: #b8872e;
      --bg-deep: #0a0e1a;
      --bg-card: rgba(15, 22, 42, 0.85);
      --bg-card-hover: rgba(25, 35, 65, 0.9);
      --accent-anemo: #74c2a8;
      --accent-pyro: #ef7938;
      --accent-hydro: #4cc2f1;
      --accent-electro: #b08fc2;
      --text-primary: #eae4d9;
      --text-secondary: #9a9489;
      --correct: #4ade80;
      --wrong: #f87171;
      --border-glow: rgba(226, 180, 77, 0.3);
      --font: 'Noto Sans JP', sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(116, 194, 168, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(176, 143, 194, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(226, 180, 77, 0.06) 0%, transparent 50%);
      z-index: 0;
      animation: bgShift 20s ease-in-out infinite alternate;
    }

    @keyframes bgShift { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    button { font-family: inherit; cursor: pointer; }

    .particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; width: 3px; height: 3px; background: var(--gold);
      border-radius: 50%; opacity: 0; animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; } 90% { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    .container {
      position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 12px 20px;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    /* ===== SCREEN FLASH OVERLAY ===== */
    .screen-flash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 99; opacity: 0;
      transition: opacity 0.15s ease-out;
    }
    .screen-flash.correct-flash {
      box-shadow: inset 0 0 80px 20px rgba(74, 222, 128, 0.4);
      border: 3px solid rgba(74, 222, 128, 0.6);
      opacity: 1;
    }
    .screen-flash.wrong-flash {
      box-shadow: inset 0 0 80px 20px rgba(248, 113, 113, 0.4);
      border: 3px solid rgba(248, 113, 113, 0.6);
      opacity: 1;
    }

    /* ===== START SCREEN ===== */
    #start-screen { text-align: center; animation: fadeInUp 0.8s ease-out; width: 100%; }

    .logo-icon { width: 60px; height: 60px; margin: 0 auto 10px; }
    .logo-icon::before {
      content: '✦'; font-size: 48px; color: var(--gold);
      text-shadow: 0 0 30px rgba(226, 180, 77, 0.5); animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }

    .logo-title {
      font-size: 32px; font-weight: 900;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 4px; margin-bottom: 4px;
    }
    .logo-subtitle { font-size: 12px; color: var(--text-secondary); letter-spacing: 6px; text-transform: uppercase; }

    .settings-section { margin: 14px 0 6px; }
    .section-label {
      font-size: 11px; color: var(--text-secondary); letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 8px;
    }

    /* Difficulty */
    .difficulty-options { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .diff-btn {
      padding: 7px 20px; border: 1px solid var(--border-glow); background: var(--bg-card);
      color: var(--text-primary); border-radius: 8px;
      font-size: 13px; font-weight: 500; transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .diff-btn:hover { background: var(--bg-card-hover); border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(226, 180, 77, 0.2); }
    .diff-btn.active, .count-btn.active {
      background: linear-gradient(135deg, rgba(226, 180, 77, 0.2), rgba(226, 180, 77, 0.1));
      border-color: var(--gold); color: var(--gold-light);
    }
    .diff-btn.active { box-shadow: 0 0 20px rgba(226, 180, 77, 0.15); }

    /* Genre chips */
    .genre-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .genre-chip {
      padding: 6px 14px; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-card);
      color: var(--text-secondary); border-radius: 24px;
      font-size: 12px; font-weight: 500; transition: all 0.3s ease;
      backdrop-filter: blur(10px); display: flex; align-items: center; gap: 5px;
      user-select: none;
    }
    .genre-chip:hover { background: var(--bg-card-hover); border-color: rgba(226, 180, 77, 0.3); }
    .genre-chip.active {
      background: linear-gradient(135deg, rgba(226, 180, 77, 0.15), rgba(226, 180, 77, 0.08));
      border-color: var(--gold); color: var(--gold-light);
    }
    .genre-chip .chip-count {
      font-size: 11px; background: rgba(255,255,255,0.06); padding: 2px 7px;
      border-radius: 10px; margin-left: 2px;
    }
    .genre-chip.active .chip-count { background: rgba(226, 180, 77, 0.2); }

    /* Question count */
    .count-options { display: flex; gap: 10px; justify-content: center; }
    .count-btn {
      padding: 6px 18px; height: 34px; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-card);
      color: var(--text-secondary); border-radius: 8px;
      font-size: 13px; font-weight: 600; transition: all 0.3s ease;
    }
    .count-btn:hover { border-color: var(--gold); color: var(--text-primary); }

    .available-count {
      font-size: 12px; color: var(--text-secondary); margin-top: 6px;
    }
    .available-count span { color: var(--gold); font-weight: 700; }

    /* 金色の塗りボタン（スタート・もう一度） */
    .start-btn, .retry-btn {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: var(--bg-deep); border: none; border-radius: 50px;
      font-size: 16px; font-weight: 700; transition: all 0.3s ease;
    }
    .start-btn:hover, .retry-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(226, 180, 77, 0.4); }
    .start-btn { margin-top: 18px; padding: 12px 50px; letter-spacing: 4px; position: relative; overflow: hidden; }
    .start-btn::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg); animation: shimmer 3s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
    .start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ===== QUIZ SCREEN ===== */
    #quiz-screen { width: 100%; display: none; }

    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 0 2px; }
    .quiz-header-left { display: flex; align-items: center; gap: 12px; }
    .question-counter { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .question-counter span { color: var(--gold); font-weight: 700; font-size: 15px; }
    .quiz-tally { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
    .tally-correct { color: var(--correct); }
    .tally-wrong { color: var(--wrong); }
    .quit-btn {
      background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--text-secondary);
      font-size: 11px; padding: 3px 10px; border-radius: 6px;
      transition: all 0.2s ease; letter-spacing: 1px;
    }
    .quit-btn:hover { border-color: var(--wrong); color: var(--wrong); }

    .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-bottom: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold-light)); border-radius: 2px; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(226, 180, 77, 0.3); }

    .question-card {
      background: var(--bg-card); border: 1px solid rgba(226, 180, 77, 0.1);
      border-radius: 10px; padding: 10px 16px; margin-bottom: 8px;
      backdrop-filter: blur(20px); position: relative; overflow: hidden;
    }
    .question-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

    .question-meta {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }
    .question-category {
      display: inline-block; font-size: 9px; color: var(--text-secondary); letter-spacing: 1px;
      padding: 2px 7px;
      background: rgba(255,255,255,0.04); border-radius: 10px; font-weight: 500;
    }
    .question-difficulty-badge {
      display: inline-block; font-size: 9px; letter-spacing: 1px;
      padding: 2px 7px; border-radius: 10px; font-weight: 600;
    }
    .badge-easy { color: var(--accent-anemo); background: rgba(116, 194, 168, 0.1); }
    .badge-normal { color: var(--accent-hydro); background: rgba(76, 194, 241, 0.1); }
    .badge-hard { color: var(--accent-pyro); background: rgba(239, 121, 56, 0.1); }
    .badge-extreme { color: var(--accent-electro); background: rgba(176, 143, 194, 0.12); }

    .question-text { font-size: 16px; font-weight: 700; line-height: 1.45; color: var(--text-primary); }

    .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .option-btn {
      width: 100%; padding: 10px 12px; background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
      color: var(--text-primary); font-size: 13px; font-weight: 500;
      text-align: left; transition: all 0.2s ease; backdrop-filter: blur(10px);
      display: flex; align-items: flex-start; gap: 8px;
    }
    .option-btn:hover:not(.disabled) {
      background: var(--bg-card-hover); border-color: rgba(226, 180, 77, 0.3);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .option-label {
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      border-radius: 5px; background: rgba(255,255,255,0.05);
      font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; transition: all 0.2s ease;
    }
    .option-btn:hover:not(.disabled) .option-label { background: rgba(226, 180, 77, 0.2); color: var(--gold); }
    .option-btn.correct { background: rgba(74, 222, 128, 0.1); border-color: var(--correct); box-shadow: 0 0 15px rgba(74, 222, 128, 0.1); }
    .option-btn.correct .option-label { background: var(--correct); color: var(--bg-deep); }
    .option-btn.wrong { background: rgba(248, 113, 113, 0.1); border-color: var(--wrong); box-shadow: 0 0 15px rgba(248, 113, 113, 0.1); }
    .option-btn.wrong .option-label { background: var(--wrong); color: var(--bg-deep); }
    .option-btn.disabled { cursor: default; opacity: 0.5; }
    .option-btn.correct.disabled, .option-btn.wrong.disabled { opacity: 1; }

    .explanation {
      margin-top: 8px; padding: 8px 12px; background: rgba(226, 180, 77, 0.05);
      border: 1px solid rgba(226, 180, 77, 0.15); border-radius: 8px;
      font-size: 12px; line-height: 1.5; color: var(--text-secondary); animation: fadeInUp 0.3s ease-out; display: none;
    }
    .explanation .exp-label { color: var(--gold); font-weight: 700; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2px; display: block; }
    .src-links { font-size: 10px; margin-top: 4px; color: var(--text-secondary); }
    .src-links a { color: var(--gold-dark); }
    .src-links a:hover { color: var(--gold); }

    .next-btn {
      display: none; margin: 8px auto 0; padding: 8px 36px;
      background: linear-gradient(135deg, rgba(226, 180, 77, 0.2), rgba(226, 180, 77, 0.1));
      border: 1px solid var(--gold); color: var(--gold-light); border-radius: 50px;
      font-size: 13px; font-weight: 600;
      transition: all 0.3s ease; letter-spacing: 2px; animation: fadeInUp 0.4s ease-out;
    }
    .next-btn:hover { background: linear-gradient(135deg, rgba(226, 180, 77, 0.3), rgba(226, 180, 77, 0.15)); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(226, 180, 77, 0.2); }

    .timer-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-bottom: 6px; overflow: hidden; }
    .timer-fill { height: 100%; width: 100%; border-radius: 2px; transition: width 0.05s linear, background-color 0.5s ease; background: var(--accent-anemo); }
    .timer-fill.warning { background: var(--accent-pyro); }

    /* ===== RESULT SCREEN ===== */
    #result-screen { display: none; text-align: center; width: 100%; animation: fadeInUp 0.8s ease-out; }
    .result-card {
      background: var(--bg-card); border: 1px solid rgba(226, 180, 77, 0.15);
      border-radius: 20px; padding: 32px 28px; backdrop-filter: blur(20px); position: relative; overflow: hidden;
    }
    .result-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-pyro), var(--gold), var(--accent-electro)); }

    .result-rank { font-size: 16px; color: var(--text-secondary); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px; }
    .result-title {
      font-size: 32px; font-weight: 900;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 32px;
    }

    .result-score-circle { width: 130px; height: 130px; margin: 0 auto 20px; position: relative; display: flex; align-items: center; justify-content: center; }
    .result-score-circle svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .result-score-circle circle { fill: none; stroke-width: 6; }
    .circle-bg { stroke: rgba(255,255,255,0.05); }
    .circle-fill { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 439.82; stroke-dashoffset: 439.82; transition: stroke-dashoffset 1.5s ease-out; }

    .result-score-number { font-size: 36px; font-weight: 900; color: var(--gold-light); }
    .result-score-number small { font-size: 16px; color: var(--text-secondary); font-weight: 500; }

    .result-stats { display: flex; justify-content: center; gap: 40px; margin: 16px 0 24px; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-value.correct-val { color: var(--correct); }
    .stat-value.wrong-val { color: var(--wrong); }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 1px; }

    .result-message { font-size: 15px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 36px; }

    .result-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .retry-btn { padding: 16px 48px; letter-spacing: 3px; }

    /* 金色の枠線ボタン（設定に戻る・閉じる） */
    .back-btn, .settings-close-btn {
      background: transparent; border: 1px solid var(--border-glow); color: var(--gold-light);
      border-radius: 50px; font-weight: 600; letter-spacing: 2px;
    }
    .back-btn:hover, .settings-close-btn:hover { background: rgba(226, 180, 77, 0.08); }
    .back-btn { padding: 16px 36px; font-size: 14px; transition: all 0.3s ease; }
    .back-btn:hover { transform: translateY(-2px); }

    /* ===== COMBO ===== */
    .combo-badge {
      display: none; font-size: 12px; font-weight: 700; color: var(--gold);
      padding: 2px 8px; border-radius: 10px; background: rgba(226, 180, 77, 0.12);
    }
    .combo-badge.show { display: inline-block; }
    @keyframes comboPop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }

    /* ===== STATS ===== */
    .stats-line { font-size: 12px; color: var(--text-secondary); margin-top: 8px; min-height: 18px; }
    .stats-line span { color: var(--gold); font-weight: 700; }
    .new-record {
      display: none; font-size: 13px; font-weight: 700; color: var(--gold-light);
      letter-spacing: 2px; margin-bottom: 12px; animation: comboPop 0.4s ease-out;
    }
    .new-record::before, .new-record::after { content: '✦'; color: var(--gold); margin: 0 8px; }

    /* ===== REVIEW ===== */
    .review-section {
      display: none; margin-top: 28px; padding-top: 22px; text-align: left;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .review-title {
      font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 10px; text-align: center;
    }
    .review-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    }
    .review-item .rv-q { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; line-height: 1.5; }
    .review-item .rv-num {
      display: inline-block; color: var(--gold); font-size: 11px; font-weight: 700;
      background: rgba(226, 180, 77, 0.12); padding: 1px 8px; border-radius: 8px; margin-right: 7px;
    }
    .review-item .rv-a { font-size: 12px; margin-bottom: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
    .review-item .rv-correct { color: var(--correct); font-weight: 600; }
    .review-item .rv-chosen { color: var(--wrong); }
    .review-item .rv-e { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }

    /* ===== SETTINGS ===== */
    .settings-btn {
      position: fixed; top: 14px; right: 14px; z-index: 60;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; backdrop-filter: blur(10px);
    }
    .settings-btn svg { width: 18px; height: 18px; }
    .settings-btn:hover { border-color: var(--gold); color: var(--gold); transform: rotate(30deg); }
    .settings-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 8, 16, 0.7); z-index: 70;
      align-items: center; justify-content: center; padding: 20px;
    }
    .settings-card {
      background: var(--bg-card); border: 1px solid var(--border-glow);
      border-radius: 16px; padding: 26px 28px; width: 100%; max-width: 340px;
      backdrop-filter: blur(20px); animation: fadeInUp 0.25s ease-out;
    }
    .settings-title {
      font-size: 14px; color: var(--gold); font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 20px; text-align: center;
    }
    .settings-row { margin-bottom: 18px; }
    .settings-row label {
      display: flex; justify-content: space-between; font-size: 13px;
      color: var(--text-primary); margin-bottom: 8px;
    }
    .settings-row label span { color: var(--gold); font-weight: 700; }
    .settings-row input[type="range"] { width: 100%; accent-color: var(--gold); cursor: pointer; }
    .settings-close-btn { display: block; margin: 8px auto 0; padding: 9px 32px; font-size: 13px; transition: all 0.2s ease; }

    /* ===== EXTREME WARNING ===== */
    .extreme-warning-box {
      max-width: 460px; margin: 0 auto; padding: 12px 18px;
      border: 1px solid rgba(239, 121, 56, 0.45); background: rgba(239, 121, 56, 0.08);
      border-radius: 12px; font-size: 12.5px; line-height: 1.8; color: var(--text-primary);
      animation: fadeInUp 0.3s ease-out;
    }
    .extreme-warning-box strong { color: var(--accent-pyro); }
    .extreme-warning-box .warn-title {
      display: block; color: var(--gold); font-weight: 700; font-size: 12px;
      letter-spacing: 3px; margin-bottom: 4px;
    }
    .extreme-warning-box .warn-title::before { content: '※ '; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 10% { transform: translateX(-12px); } 30% { transform: translateX(10px); } 50% { transform: translateX(-8px); } 70% { transform: translateX(6px); } 90% { transform: translateX(-3px); } }

    .confetti-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .confetti { position: absolute; width: 8px; height: 8px; top: -10px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

    @media (max-width: 600px) {
      .container { padding: 16px; }
      .logo-title { font-size: 30px; }
      .question-text { font-size: 17px; }
      .option-btn { padding: 14px 18px; font-size: 14px; }
      .result-card { padding: 32px 20px; }
      .difficulty-options { gap: 8px; }
      .diff-btn { padding: 8px 18px; font-size: 13px; }
      .genre-chip { padding: 7px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="screen-flash" id="screen-flash"></div>

  <button class="settings-btn" id="settings-btn" title="設定" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-card">
      <p class="settings-title">設定</p>
      <div class="settings-row">
        <label>BGM音量 <span id="bgm-vol-label">40%</span></label>
        <input type="range" id="bgm-vol" min="0" max="100" step="5">
      </div>
      <div class="settings-row">
        <label>SE音量 <span id="se-vol-label">100%</span></label>
        <input type="range" id="se-vol" min="0" max="100" step="5">
      </div>
      <button class="settings-close-btn" id="settings-close">閉じる</button>
    </div>
  </div>

  <div class="container">
    <!-- START SCREEN -->
    <div id="start-screen">
      <div class="logo-icon"></div>
      <h1 class="logo-title">原神クイズ</h1>
      <p class="logo-subtitle">Genshin Impact Quiz</p>

      <div class="settings-section">
        <p class="section-label">難易度</p>
        <div class="difficulty-options" id="difficulty-options"></div>
      </div>

      <div class="settings-section" id="genre-section">
        <p class="section-label">ジャンル（複数選択可）</p>
        <div class="genre-grid" id="genre-grid"></div>
      </div>

      <div class="settings-section" id="extreme-warning" style="display: none;">
        <div class="extreme-warning-box" id="extreme-warning-box"></div>
      </div>

      <div class="settings-section">
        <p class="section-label">出題数</p>
        <div class="count-options" id="count-options"></div>
        <p class="available-count">選択中の問題プール: <span id="pool-count">0</span>問</p>
        <p class="stats-line" id="stats-line"></p>
      </div>

      <button class="start-btn" id="start-btn">スタート</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen">
      <div class="quiz-header">
        <div class="quiz-header-left">
          <div class="question-counter">Q.<span id="q-current">1</span> / <span id="q-total">10</span></div>
          <div class="quiz-tally"><span class="tally-correct">○<span id="tally-correct">0</span></span><span class="tally-wrong">×<span id="tally-wrong">0</span></span></div>
          <span class="combo-badge" id="combo-badge"></span>
        </div>
        <button class="quit-btn" id="quit-btn">中断</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="question-card" id="question-card">
        <div class="question-meta">
          <span class="question-category" id="q-category">キャラクター</span>
          <span class="question-difficulty-badge" id="q-diff-badge"></span>
        </div>
        <p class="question-text" id="q-text"></p>
      </div>
      <div class="options-container" id="options-container"></div>
      <div class="explanation" id="explanation">
        <span class="exp-label">解説</span>
        <p id="exp-text"></p>
        <p class="src-links" id="exp-src"></p>
      </div>
      <button class="next-btn" id="next-btn">次の問題 →</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen">
      <div class="result-card">
        <p class="result-rank" id="result-rank">RANK</p>
        <h2 class="result-title" id="result-title">称号</h2>
        <div class="result-score-circle">
          <svg viewBox="0 0 160 160">
            <circle class="circle-bg" cx="80" cy="80" r="70"></circle>
            <circle class="circle-fill" id="circle-fill" cx="80" cy="80" r="70"></circle>
          </svg>
          <div class="result-score-number">
            <span id="result-score">0</span><small> / <span id="result-total">10</span></small>
          </div>
        </div>
        <div class="result-stats">
          <div class="stat-item"><div class="stat-value correct-val" id="stat-correct">0</div><div class="stat-label">正解</div></div>
          <div class="stat-item"><div class="stat-value wrong-val" id="stat-wrong">0</div><div class="stat-label">不正解</div></div>
        </div>
        <p class="new-record" id="new-record">自己ベスト更新</p>
        <p class="result-message" id="result-message"></p>
        <div class="result-buttons">
          <button class="retry-btn" id="retry-btn">もう一度</button>
          <button class="back-btn" id="back-btn">設定に戻る</button>
        </div>
        <div class="review-section" id="review-section"></div>
      </div>
    </div>
  </div>

<script>
// =======================================================================
//  QUIZ DATA – ジャンル × 難易度
// =======================================================================
const GENRES = {
  character: { label: "キャラクター" },
  element:   { label: "元素・反応" },
  story:     { label: "ストーリー・世界観" },
  region:    { label: "地域・探索" },
  weapon:    { label: "武器・聖遺物" },
  system:    { label: "システム" },
};

const quizData = {
  // ────────────── キャラクター ──────────────
  character: {
    easy: [
      { q: "主人公（旅人）の双子の兄妹の名前は？", o: ["空と蛍","鍾離と甘雨","刻晴と行秋","ディルックとジン"], a: 0, e: "旅人はテイワットの外からやって来た双子で、デフォルトネームは兄が「空」、妹が「蛍」です。ゲーム開始時に選ばなかった方は、のちにアビス教団の王子（姫）になっています。", s: ["キャラ・一族・団体","キャラ・一族・団体/カーンルイア"] },
      { q: "パイモンの自称は？", o: ["パイモン様","オイラ","ボク","ワタシ"], a: 1, e: "パイモンは自分のことを「オイラ」と呼びます。旅人と一緒に旅をしており、「テイワット一のガイド」を自称しています。", s: ["パイモン"] },
      { q: "バーバラの職業は？", o: ["騎士","祈祷牧師","商人","冒険者"], a: 1, e: "バーバラは西風教会の祈祷牧師で、モンドのアイドルでもあります。よく勘違いされますが、シスターではありません。姉はジンです。", s: ["バーバラ"] },
      { q: "ウェンティの正体は？", o: ["普通の吟遊詩人","風神バルバトス","旅人の友達","天理の使者"], a: 1, e: "ウェンティの正体は風神バルバトスです。普段はモンドの吟遊詩人として歌っており、リンゴとにぎやかな雰囲気が大好きです。", s: ["ウェンティ"] },
      { q: "璃月の岩神（岩王帝君）の正体であるキャラクターは？", o: ["ウェンティ","鍾離","雷電将軍","ナヒーダ"], a: 1, e: "鍾離の正体は、璃月を治めてきた岩神モラクス（岩王帝君）です。往生堂の客卿として暮らしており、魔神任務では事前に結んだ契約に基づき、自らの神の心をファデュイに譲り渡しました。", s: ["鍾離"] },
      { q: "タルタリヤが所属する組織は？", o: ["西風騎士団","千岩軍","ファデュイ","璃月七星"], a: 2, e: "タルタリヤ（公子）はファデュイ執行官の第十一位です。手強い敵ほど喜ぶ戦闘狂である一方、家族ととても仲がよく、テウセルという弟もいます。", s: ["タルタリヤ"] },
      { q: "クレーの得意な元素は？", o: ["風","炎","雷","岩"], a: 1, e: "クレーは炎元素のキャラクターで、「ボンボン爆弾」などの爆弾を使って戦います。西風騎士団の「火花騎士」で、湖の魚をドカーンしては代理団長のジンに反省室へ閉じ込められています。", s: ["クレー"] },
      { q: "魔女会のメンバーとして初めてプレイアブル実装されたキャラクターは？", o: ["アリス","ニコ","レインドット","バーベロス"], a: 1, e: "ニコは初の魔女会メンバーとして実装された、星5の炎元素・法器キャラクターです。元素スキルでシールドを張りつつ、チーム全員の攻撃力をアップできるサポーターとして活躍します。", s: ["ニコ"] },
      { q: "フィッシュルの本名とされる名前は？", o: ["エミ","リサ","モナ","ジン"], a: 0, e: "フィッシュルの本名は「エミ」とされ、親族からは「エミちゃん」と呼ばれています。「断罪の皇女」フィッシュル・ヴォン・ルフシュロス・ナフィードットを名乗り、漆黒の鴉オズとともに行動しています。", s: ["フィッシュル"] },
      { q: "刻晴の元素は？", o: ["炎","水","雷","風"], a: 2, e: "刻晴は雷元素の片手剣キャラクターで、璃月七星の「玉衡」です。「帝君の一言で決まる璃月」に不満を持っています。", s: ["刻晴"] },
    ],
    normal: [
      { q: "甘雨は何と人間の混血？", o: ["仙獣・麒麟","龍","鳳凰","天狐"], a: 0, e: "甘雨は仙獣「麒麟」と人間の混血で、「月海亭」で璃月七星全体の秘書を務めています。三千年前に岩王帝君と結んだ契約のもとで働き続けており、菜食主義者で昼寝の習慣があります。", s: ["甘雨"] },
      { q: "胡桃が経営する店の名前は？", o: ["万民堂","往生堂","不卜庵","和裕茶館"], a: 1, e: "胡桃（フータオ）は璃月の葬儀屋「往生堂」の七十七代目堂主です。鍾離はこの往生堂に招かれた客卿です。詩の創作も得意で、行秋とは即興で詩を競い合う仲です。", s: ["胡桃"] },
      { q: "八重神子の種族は？", o: ["人間","天狐","鬼","龍"], a: 1, e: "八重神子は白辰の血筋を継ぐ天狐で、鳴神大社の宮司を務めています。娯楽小説の出版社「八重堂」の編集長でもあります。", s: ["八重神子"] },
      { q: "楓原万葉の出身国は？", o: ["モンド","璃月","稲妻","スメール"], a: 2, e: "楓原万葉（かえではらかずは）は稲妻出身の浪人です。今は北斗が船長を務める、璃月の「南十字」武装船隊と行動を共にしています。", s: ["楓原万葉"] },
      { q: "ディシアの元素は？", o: ["炎","岩","草","雷"], a: 0, e: "ディシアは炎元素の両手剣キャラクターで、スメールの砂漠を渡り歩く傭兵集団「エルマイト旅団」の一人です。傭兵団「熾光の猟獣」に所属し、「熾鬣の獅子」の異名で知られています。", s: ["ディシア"] },
      { q: "アルハイゼンの役職は？", o: ["大賢者","書記官","レンジャー長","学者"], a: 1, e: "アルハイゼンはスメール教令院の「書記官」です。情勢が安定しない時期に代理賢者を兼任しましたが、その座に居座ることなく予定通り辞め、大賢者への勧誘も断り続けています。", s: ["アルハイゼン"] },
      { q: "宵宮の職業は？", o: ["料理人","花火職人","鍛冶師","巫女"], a: 1, e: "宵宮（よいみや）は稲妻の「長野原花火屋」の店主で、腕の立つ花火職人です。「夏祭りの女王」とも呼ばれ、子供たちからは「英雄のお姉ちゃん」として慕われています。", s: ["宵宮"] },
      { q: "ナド・クライで生まれた「月の少女」で、かつてファデュイ執行官の第三位だったキャラクターは？", o: ["カピターノ","コロンビーナ","ドットーレ","パンタローネ"], a: 1, e: "コロンビーナはかつてファデュイ執行官の第三位「少女」でした。ナド・クライで生まれた「月の少女」と紹介されており、実装日の1月14日がそのまま誕生日として明かされました。", s: ["コロンビーナ"] },
      { q: "ナヴィアが率いる組織の名前は？", o: ["冒険者協会","棘薔薇の会","ファデュイ","メロピデ要塞"], a: 1, e: "ナヴィアはフォンテーヌの組織「棘薔薇の会（スピナ・ディ・ロースラ）」の現会長です。父カーレスから会長の座を継いで以来、奔走し続けています。", s: ["ナヴィア"] },
      { q: "シグウィンの種族は？", o: ["人間","メリュジーヌ","純水精霊","天使"], a: 1, e: "シグウィンはメリュジーヌで、メロピデ要塞の看護師長を務めています。メリュジーヌでありながら人間の姿をしていることは、公然の秘密として広まっています。", s: ["シグウィン"] },
    ],
    hard: [
      { q: "アルベドが師匠のメモから理解した、カーンルイアの「生命の創造」を重んじる錬金術は？", o: ["黒土の術","白亜の術","錬丹術","仙術"], a: 0, e: "地底深くに隠された国カーンルイアの錬金術は「生命の創造」に重きを置いており、命を育てるその術を「黒土の術」といいます。幼いアルベドは師匠レインドットのメモからそれを理解しました。「黒土」のもう一つ上の存在が「白亜」で、アルベドは「白亜の申し子」と呼ばれています。", s: ["アルベド"] },
      { q: "雷電将軍（影）の魔神としての名前は？", o: ["バアルゼブル","バアル","雷電眞","ハーゲントゥス"], a: 0, e: "雷電影の魔神としての名は「バアルゼブル」です。先代の雷神で姉の雷電眞は「バアル」と呼ばれ、500年前のカーンルイアへの遠征で亡くなりました。", s: ["キャラ・一族・団体/稲妻"] },
      { q: "散兵（放浪者）が、たたら砂で暮らしていた頃に人々から呼ばれていた名前は？", o: ["傾奇者","国崩","散兵","雷電悟"], a: 0, e: "雷神の造物である彼は、最後まで名前を与えられず、証として小さな金の羽根だけを渡されました。たたら砂がまだ栄えていた時代は「傾奇者」の名で住民たちと暮らしていましたが、稲妻を離れた後にその名を捨てています。「散兵」は後に氷の女皇から授かった、ファトゥス第六位としての名です。", s: ["放浪者"] },
      { q: "ナヒーダが「籠の中の鳥」として暮らしていた場所は？", o: ["ジャングル","教令院の地下","スラサタンナ聖処","砂漠の遺跡"], a: 2, e: "ナヒーダ（クラクサナリデビ）は、先代の草神が逝去したのち賢者たちによってスラサタンナ聖処へ迎え入れられ、そこで「籠の中の鳥」として暮らしていました。約五百年もの間、冷遇され続けたとされています。", s: ["ナヒーダ"] },
      { q: "リネとリネットの育ての親（「お父様」）は誰？", o: ["アルレッキーノ","道化ピエロ","博士ドットーレ","隊長カピターノ"], a: 0, e: "二人は「壁炉の家」の出身で、その主であるファデュイ執行官第四位「召使」アルレッキーノを「お父様」と慕っています。アルレッキーノは、先代から名を受け継ぐまで「ペルヴェーレ」と呼ばれていました。", s: ["アルレッキーノ","リネ"] },
      { q: "フリーナは、水神フォカロルスにとってどんな存在？", o: ["フォカロルスの姉","フォカロルスが自らから分離した「人性」","フォカロルスに仕えるメリュジーヌ","フォカロルスより前の先代水神"], a: 1, e: "フォカロルスは予言を回避するため、自らの「人性」を分離して「フリーナ」と名付けました。「神性」としてのフォカロルスは神の心と共に諭示裁定カーディナルの中に潜み、フリーナは何も知らされないまま、500年にわたって神を演じ続けました。", s: ["キャラ・一族・団体/フォンテーヌ"] },
      { q: "稲妻出身の千織がフォンテーヌで営むブティックの名前は？", o: ["千織屋","織千屋","緋織堂","千鶴庵"], a: 0, e: "千織はフォンテーヌで「千織屋」を営む有名なファッションデザイナーです。稲妻を離れてフォンテーヌにやって来ており、「千織」の名が必ず自分より先に稲妻へ戻ると誓っています。", s: ["千織"] },
      { q: "カーヴェの元素と得意なことは？", o: ["岩・彫刻","草・建築","水・音楽","風・絵画"], a: 1, e: "カーヴェは草元素の両手剣キャラクターで、教令院妙論派出身の建築デザイナーです。アルカサルザライパレスを単独でデザインしてスメールに名を轟かせましたが、そのプロジェクトで破産し、今は昔の友人である書記官アルハイゼンの家に住み着いています。", s: ["カーヴェ"] },
      { q: "白朮の体が弱い理由は？", o: ["生まれつき","長生との契約の代償","呪いを受けた","深淵に蝕まれた"], a: 1, e: "白朮は、仙気を帯びた喋る白蛇「長生」と契約を結んでいます。その契約によって、医術で世と民を救う力と引き換えに、白朮の身体は病に侵されました。", s: ["白朮"] },
      { q: "エウルアの家系は何の末裔？", o: ["旧貴族ローレンス家","グンヒルド家","ラグヴィンド家","アルベリヒ家"], a: 0, e: "エウルアは、かつてモンドを闇に陥れた旧貴族「ローレンス家」の末裔です。旧貴族と敵対関係にある西風騎士団に入団し、遊撃小隊隊長を務めています。「復讐」を口にしますが、根は善良で打たれ強い人物です。", s: ["エウルア"] },
    ],
    extreme: [
      { q: "璃月の仙人を指す別称（美称）は？", o: ["三眼五顕仙人","千岩五嶽真君","護法夜叉大将","浮世散風真君"], a: 0, e: "「三眼五顕仙人」は仙人の別称・美称で、略して「三眼」とも言います。「三眼」とは元素を操る力のことで、この力は人間の場合「神の目」となって現れます。", s: ["用語集","キャラ・一族・団体/璃月"] },
      { q: "タルタリヤの師匠スカーク、そのさらに師匠にあたる存在は？", o: ["「極悪騎」スルトロッチ","「予言者」ヴェズルフェルニル","「黄金」レインドット","「末光の剣」ダインスレイヴ"], a: 0, e: "スカークの師匠は「極悪騎」スルトロッチです。スカークはタルタリヤに武芸を仕込んだ師なので、スルトロッチはタルタリヤにとって師匠の師匠にあたります。", s: ["スカーク","タルタリヤ"] },
    ],
  },

  // ────────────── 元素・反応 ──────────────
  element: {
    easy: [
      { q: "原神に登場する元素は全部でいくつ？", o: ["5つ","6つ","7つ","8つ"], a: 2, e: "元素は「炎・水・氷・雷・風・岩・草」の7種類が存在し、異なる元素は互いに反応を起こします。", s: ["用語集"] },

      { q: "風元素の英語名は？", o: ["Pyro","Anemo","Cryo","Geo"], a: 1, e: "風元素は英語で「Anemo」です。ほかに、炎元素は「Pyro」、氷元素は「Cryo」、岩元素は「Geo」と呼ばれます。", s: ["中国語・英語まとめ"] },
      { q: "「過負荷」反応を起こす元素の組み合わせは？", o: ["炎 + 雷","炎 + 水","雷 + 水","雷 + 氷"], a: 0, e: "炎元素と雷元素が接触すると「過負荷」が発生し、激しい爆発で炎元素範囲ダメージを与えます。強いノックバック効果があり、敵の盾も破壊しやすい反応です。", s: ["元素反応について"] },
      { q: "「拡散」反応を起こす元素は？", o: ["風 + 他の元素","岩 + 他の元素","草 + 他の元素","氷 + 他の元素"], a: 0, e: "炎・水・雷・氷のいずれかが付着した敵に風元素攻撃を当てると「拡散」が発生し、拡散した元素を周囲の敵に付着させます（水元素以外は周囲にも範囲ダメージを与えます）。聖遺物「翠緑の影」の4セット効果で、元素耐性を下げるデバフを撒くこともできます。", s: ["元素反応について"] },
      { q: "岩元素の「結晶」反応で得られるものは？", o: ["攻撃力アップ","元素シールド","回復","元素エネルギー"], a: 1, e: "岩元素が炎・水・雷・氷元素と接触すると「結晶」が発生し、その元素の結晶が作られます。結晶に触れるとシールドが展開され、すべてのダメージを一定量まで吸収します。", s: ["元素反応について"] },

      { q: "元素熟知がダメージ量に影響しない反応はどれ？", o: ["蒸発","溶解","凍結","拡散"], a: 2, e: "元素反応によるダメージには、蒸発・溶解のように攻撃のダメージを増幅するものと、拡散・過負荷などのように追加ダメージを与えるものがあり、どちらも元素熟知の影響を受けます。凍結は敵を行動不能にする反応で、これらのダメージを伴う反応には含まれません。", s: ["元素反応について"] },
      { q: "「溶解」反応で、氷状態の敵に炎で攻撃した時の基礎倍率は？", o: ["1.5倍","2倍","2.5倍","3倍"], a: 1, e: "氷元素が付着した敵に炎元素で攻撃すると、溶解のダメージは2倍になります。逆に、炎元素が付着した敵に氷元素で攻撃した場合は1.5倍です。", s: ["元素反応について"] },
      { q: "聖遺物「翠緑の影」の4セット効果の内容は？", o: ["拡散ダメージ+60%、かつ拡散元素の敵耐性-40%","拡散ダメージ+40%、かつ拡散元素の敵耐性-30%","拡散ダメージ+60%、かつ風元素ダメージ+15%","拡散ダメージ+40%、かつ拡散元素の敵耐性-40%"], a: 0, e: "翠緑の影の4セット効果は、拡散反応によるダメージ+60%に加え、拡散された元素タイプを基準に、影響を受けた敵の元素耐性を10秒間40%下げます。", s: ["聖遺物/セット効果"] },
      { q: "「烈開花」は草原核にどの元素を当てると発生する？", o: ["雷","炎","風","氷"], a: 1, e: "生成された草原核に炎元素が触れると「烈開花」が起こり、草元素範囲ダメージを与えます。雷元素に触れた場合は「超開花」となり、草元素の追尾弾を発射します。", s: ["元素反応について"] },
      { q: "「激化」反応のベースとなる「原激化」を起こす元素の組み合わせは？", o: ["草 + 雷","草 + 水","草 + 炎","草 + 風"], a: 0, e: "草元素と雷元素で「原激化」状態になります。この状態の敵に雷元素の攻撃が当たると「超激化」、草元素の攻撃が当たると「草激化」が起こり、レベルと元素熟知に応じた値が攻撃のダメージ基礎値に加算されます。", s: ["元素反応について"] },

    hard: [
      { q: "凍結状態の敵に「氷砕き」を起こせる攻撃として正しいものは？", o: ["岩元素攻撃や、両手剣による攻撃","片手剣による通常攻撃","水元素による攻撃","風元素による攻撃"], a: 0, e: "凍結状態の敵に、岩元素攻撃や両手剣による攻撃（片手剣・長柄武器の落下攻撃なども含む）を当てると氷砕きが発生し、物理ダメージを与えて凍結を解除します。凍結中の敵に水元素を当てても反応せず、風元素を当てると氷元素の拡散が起こります。", s: ["元素反応について"] },
      { q: "蒸発・溶解で、倍率の低い「1.5倍」側の反応にある利点は？", o: ["先に付着していた元素が残りやすく、続けて反応を起こしやすい","元素熟知による倍率アップが2倍になる","反応後に敵の元素耐性が下がる","会心率が上がる"], a: 0, e: "蒸発・溶解には、元素を付着させる順序によって1.5倍と2倍のパターンがあります。1.5倍の反応は見た目の倍率こそ劣りますが、先に付着していた元素の量が多い場合はその元素が残りやすく、連続して元素反応を起こすことができます。", s: ["元素反応について"] },
      { q: "元素チャージ効率のステータスが影響するのは？", o: ["元素爆発のエネルギー獲得量","元素スキルのダメージ","元素反応のダメージ","元素スキルのクールタイム"], a: 0, e: "元素粒子や元素オーブを取得した際の元素エネルギーの回復量は「基礎エネルギー量 × 元素チャージ効率」で決まります。元素爆発に使う元素エネルギーを貯めやすくするステータスです。", s: ["元素チャージについて"] },
      { q: "「超開花」と「烈開花」の挙動の違いは？", o: ["超開花は単体追尾弾・烈開花は範囲爆発","超開花は範囲爆発・烈開花は単体追尾","どちらも範囲爆発","どちらも単体追尾"], a: 0, e: "草原核に雷元素が触れると「超開花」となり、草元素の追尾弾を発射します。炎元素が触れると「烈開花」となり、草元素の範囲ダメージを与えます。", s: ["元素反応について"] },
      { q: "感電状態（雷元素と水元素が同時に付着）の敵に風元素で攻撃すると、拡散はどう起こる？", o: ["雷元素を優先して拡散し、風元素が余れば水元素も拡散する","水元素を優先して拡散し、風元素が余れば雷元素も拡散する","雷元素だけが拡散される","拡散は起こらない"], a: 0, e: "感電状態では雷元素と水元素が共存しています。ここに風元素を当てると雷元素と優先的に反応し、元素が余った場合に水元素とも反応するため、雷拡散と水拡散を同時に起こせます。", s: ["元素反応について"] },
      { q: "原神のダメージ計算において、「ダメージバフ（元素バフ等）」と「会心ダメージ」はどう計算される？", o: ["乗算（別々の枠）で計算される","加算（同じ枠）で計算される","会心が先に計算される","ダメージバフが先に計算される"], a: 0, e: "ダメージは「(参照ステータス × 天賦倍率 …) × ダメージバフ補正 × 会心補正 × …」の形で計算されます。ダメージバフ補正（1＋ダメージバフの合計）と会心補正は、それぞれ別の枠として掛け合わされます。", s: ["ダメージ計算式"] },
      { q: "「結晶」反応で生成されるシールドが、特によく吸収するダメージは？", o: ["すべての元素ダメージ","結晶と同じ元素のダメージ","物理ダメージのみ","岩元素ダメージのみ"], a: 1, e: "結晶シールドはすべてのダメージを一定量まで吸収しますが、シールドと同じ元素のダメージに対しては吸収量が大きく増えます。例えば炎と岩でできた炎結晶のシールドは、炎元素ダメージを特によく吸収します。", s: ["元素反応について"] },
      { q: "バーバラの元素スキル展開中、出場キャラ自身にも水元素が付着することで起こり得るデメリットは？", o: ["敵の氷攻撃で凍結してしまう","攻撃力が下がる","回復量が下がる","スタミナが減り続ける"], a: 0, e: "バーバラの元素スキル発動中は、出場キャラにも一定時間置きに一瞬だけ水元素が付着します。自キャラへの元素付着ではダメージは発生しませんが、凍結だけは行動不能効果が発生するため、氷元素を付着させられると凍結で動けなくなる危険があります。一方で、この自己付着は付着元素の除去に役立つこともあります。", s: ["バーバラ"] },

    hard: [
      { q: "「第四降臨者」とされる存在は誰？", o: ["旅人","パイモン","天理","ダインスレイヴ"], a: 0, e: "「降臨者」は、外界から現在のテイワットに訪れた存在のうち、ひとつの世界に匹敵する強い意志を持つものを指します。スメール編でブエル（ナヒーダ）は、これまでに4人ほどの降臨者が存在しており、旅人は第四降臨者だと推測しています。", s: ["用語集"] },
      { q: "テイワット各地に棲む魔物「ヒルチャール」の正体は？", o: ["ファデュイの離脱者","神の呪いによって変貌させられた人間","天空の島の使者","魔神の眷属"], a: 1, e: "ヒルチャールの正体は、神の呪いによって変貌させられた人間です。カーンルイアの厄災の際には純血でないカーンルイア人のほぼ全てがヒルチャールになり、数が急増しました。ただし、呪いによる変貌はそれ以前から起こっていたため、すべてのヒルチャールがカーンルイア人というわけではありません。", s: ["用語集"] },
      { q: "ファデュイ執行官（ファトゥス）の第1位は？", o: ["隊長カピターノ","博士ドットーレ","少女コロンビーナ","道化ピエロ"], a: 0, e: "執行官の第1位は「隊長」カピターノです。魔神任務第五章第五幕の後も、女皇は第一位を引き続き「隊長」のものとすることを決めました。なお「道化」ピエロは、番号付きの執行官とは別の「統括官」という立場です。", s: ["キャラ・一族・団体/スネージナヤ"] },
      { q: "フォンテーヌの「原罪」の真相とは？", o: ["フォンテーヌ人は元々純水精霊だった","天理に呪われた民族だった","カーンルイアの末裔だった","機械人形だった"], a: 0, e: "フォンテーヌ人の「原罪」とは、先代の水神が天理から原始胎海を奪い、純水精霊から勝手に人間を作ったことでした。そのためフォンテーヌ人は原始胎海の水に溶け、元の姿に還ってしまいます。", s: ["ストーリー要約/魔神任務"] },
      { q: "『日月前事』の伝承によると、「原初のあの方」（パネース）が行ったことは？", o: ["テイワットに七元素をもたらした","旧世界の主である七名の王と戦い、勝利して従属させた","深淵を封印した","天空の島を地上に降ろした"], a: 1, e: "『日月前事』の伝承によると、「原初のあの方」（パネース）は旧世界の主である七名の王と戦い、勝利して従属させたのち、人間を含むありとあらゆるものを創造しました。年表では「第一降臨者」ともされています。", s: ["キャラ・一族・団体/稲妻","年表"] },
      { q: "七神が持つ「神の心」の正体として、スカークが明かしたものは？", o: ["第三降臨者の遺骨","原初のあの方の心臓","天空の島の欠片","神の目を束ねた結晶"], a: 0, e: "神の心は七神が持つ元素制御中枢で、最初の七執政は神の心によって天空の島と共鳴していました。その正体について、スカークは「第三降臨者の遺骨」だと明かしています。現在、炎神の心以外はファデュイの手にあります。", s: ["用語集","キャラ・一族・団体","キャラ・一族・団体/その他"] },
      { q: "ダインスレイヴの異名は？", o: ["末光の剣","暗夜の英雄","淵の使徒","薪炎の裁判官"], a: 0, e: "ダインスレイヴは、カーンルイアの宮廷親衛隊長「末光の剣」でした。カーンルイア滅亡の際に不死の呪いをかけられながらも、現在はアビス教団の計画を止めるために動いています。", s: ["年表","キャラ・一族・団体","キャラ・一族・団体/カーンルイア"] },
      { q: "スメール編で深く関わる「世界樹」とは、どんな存在？", o: ["テイワットのあらゆる事象の記憶を記録している存在","元素エネルギーを無限に生み出す樹","七神に力を与える源","気候を完全に制御する装置"], a: 0, e: "世界樹はテイワットの地下奥深くにあり、古代から現代までのテイワットに属するあらゆる事象の記憶を記録している存在です。世界樹の記憶に干渉すると過去が改変され、人々の記憶からも消えてしまいます。草神ブエルはこの世界樹から生まれました。", s: ["用語集","キャラ・一族・団体/スメール"] },
    ],
    extreme: [
      { q: "魔神オロバシが天理に罪を問われる原因となった、世界の秘密が記された禁書は？", o: ["『日月前事』","『白夜国地誌』","『淵下宮御史記』","『千風神録』"], a: 0, e: "オロバシは淵下宮（白夜国）に保管されていた『日月前事』を読み、「諸神」と天空の島がテイワットの外から来たものだと知ってしまいました。これが天理に知られて死刑を宣告されたオロバシは、『日月前事』を特級の禁書に指定し、その内容を隠し通そうとしました。最終的には雷神の「無想の一太刀」に討たれ、ヤシオリ島には今もその骨が残っています。", s: ["キャラ・一族・団体/稲妻"] },
      { q: "「原初のあの方」が創造したとされる「四つの光る影」のうち、『時』を司る執政の名前は？", o: ["イスタロト","パネース","ロノヴァ","ナベリウス"], a: 0, e: "時の執政イスタロトは、『日月前事』に記されたパネース（原初のあの方）が創造した「四つの光る影」の一柱です。淵下宮ではかつて「常世大神カイロス」と呼ばれ、地下世界に閉じ込められた人々を救って信仰を集めました。ほかの執政には、カーンルイア人に不死の呪いをかけた死の執政ロノヴァや、「黄金」レインドットに存在を乗っ取られている生の執政ナベリウスがいます。", s: ["キャラ・一族・団体","ストーリー要約/魔神任務"] },
      { q: "カーンルイア最後の王、「黒王」とも呼ばれる独眼の王の名前は？", o: ["イルミンズール","アンフォルタス","コロタール・アルベリヒ","フロプタチュール"], a: 0, e: "カーンルイア最後の王朝・黒日王朝の末代の王は、独眼の「黒王」イルミンズール（イルミン）です。旅人の肉親を王位継承者に迎えましたが、アビスの誘惑に堕ちたとされています。赤月王朝の生き残りを粛正する、黒王直属の処刑人「月の狩人」も存在しました。", s: ["キャラ・一族・団体/カーンルイア","アルレッキーノ"] },
      { q: "カーンルイアの「五大罪人」の一人で、ダインスレイヴの実の兄とされる「予言者」は？", o: ["ヴェズルフェルニル","スルトロッチ","レインドット","アンフォルタス"], a: 0, e: "「予言者」ヴェズルフェルニルはダインスレイヴの実兄で、カーンルイアの「五大罪人」の一人です。コロタール・アルベリヒを導いてアビス教団を作らせた人物とされています。", s: ["キャラ・一族・団体/カーンルイア"] },
      { q: "ナド・クライ編の核心に関わる「月の三女神」の名前の正しい組み合わせは？", o: ["アリア・ソネット・カノン","アリア・ソナタ・カノン","アリア・ソネット・フーガ","セレナーデ・ソネット・カノン"], a: 0, e: "月の三女神は、恒月の女神アリア（長女）、霜月の女神カノン（次女）、虹月の女神ソネット（三女）です。名前はいずれも音楽や詩の形式に由来します。空月の歌第八幕では、未来から遡って来たコロンビーナに三人の力を譲渡し、コロンビーナが開いた扉から家へと帰っていきました。", s: ["キャラ・一族・団体","年表"] },
    ],
  },

  region: {

      { q: "水の国フォンテーヌの下に広がっている、巨大な淡水湖の名前は？", o: ["地上大湖","星落としの湖","シードル湖","深淵の湖"], a: 0, e: "水の国フォンテーヌは、地上大湖という巨大な淡水湖の上に位置しています。神の目を持つ者なら、この地上大湖の中で自由に息をしたり話したりできます。", s: ["フォンテーヌ"] },

      { q: "「ドラゴンスパイン」はどの国にある山？", o: ["璃月","モンド","稲妻","スメール"], a: 1, e: "ドラゴンスパインはモンド南部の雪山で、かつてモンドを襲った毒龍ドゥリンが眠る地とされています。地域全体が極寒環境で、行動しているうちに「極寒ゲージ」が溜まっていきます。", s: ["ドラゴンスパイン","キャラ・一族・団体/モンド"] },
      { q: "璃月の崖で採集できる、地面に向けて咲く花は？", o: ["風車アスター","琉璃袋","緋櫻毬","カルパラタ蓮"], a: 1, e: "琉璃袋は璃月の崖で採集できる、生命力旺盛な花です。地面に向けて咲くのは、自らの香りを守るためだといわれています。", s: ["バッグ/材料"] },

    normal: [

      { q: "フォンテーヌの海底に存在する巨大な水中監獄の名前は？", o: ["エピクレシス歌劇場","メロピデ要塞","エリナス","ポワソン町"], a: 1, e: "メロピデ要塞はフォンテーヌの海底にある巨大な監獄施設で、管理者は「公爵」と呼ばれるリオセスリです。", s: ["シグウィン","キャラ・一族・団体/フォンテーヌ"] },
      { q: "魔神任務「空月の歌」の第九幕・第十幕（Luna VII）で、物語の主な舞台となった地域は？", o: ["モンド","璃月","スメール","フォンテーヌ"], a: 2, e: "Luna VII の期間中に進められる空月の歌の第九幕・第十幕は、スメールで起きた奇妙な出来事を受けてスメールシティに戻るところから始まり、スメール任務の集大成のようなストーリー展開になっています。", s: ["空月の歌"] },
      { q: "ナタの民は、いくつの部族に分かれている？", o: ["4つ","5つ","6つ","7つ"], a: 2, e: "ナタの民は、風以外の6元素に対応した6つの部族に分かれており、それぞれの竜を仲間にして共生しています。", s: ["ナタ"] },
      { q: "稲妻の「セイライ島」に封印されている、雷鳥の怨念が実体化した存在は？", o: ["雷神の分身","浅瀬神社の猫又","雷音権現","アビス教団の魔術師"], a: 2, e: "鶴観の民を滅ぼした雷鳥は、のちにセイライ島で雷神に討伐されました。このとき残り続けた怨恨が高濃度の雷元素と反応し、「雷音権現」として実体化して厄災をもたらしました。雷音権現は、浅瀬神社と島の各所に設置された鎮め石によって封印されています。", s: ["キャラ・一族・団体/稲妻","セイライ島"] },

    hard: [
      { q: "旧貴族（ローレンス家など）が圧政を敷いていたのは現在のモンドのどこ？", o: ["モンド城","ドラゴンスパイン周辺","旧モンド（風龍廃墟）","誓いの岬"], a: 0, e: "旧貴族が圧政を敷いていたのは、現在のモンド城です。約1000年前、風神の助けを得た奴隷剣士ヴァネッサによって旧貴族は打倒され、モンド城は腐敗貴族から解放されました。風龍廃墟は、それより昔に魔神デカラビアンが治めていた「旧モンド」です。", s: ["用語集","キャラ・一族・団体/モンド"] },
      { q: "フォンテーヌのベリル地区にある「エリナス」とは何？", o: ["古代の建築物","巨獣の遺骸","フォンテーヌの初代水神","巨大な機械兵器"], a: 1, e: "エリナスは、かつてフォンテーヌに現れた巨獣です。現在は死亡しており、その巨大な骨格がベリル地区を形づくっています。エリナスの体内で発生した戦闘の余波からメリュジーヌが誕生し、エリナスは親として彼女たちに接しました。", s: ["キャラ・一族・団体/フォンテーヌ"] },
      { q: "「帰終（きしゅう）」とは璃月の歴史において何者だった？", o: ["岩神の敵の魔神","鍾離と共に帰離原を作った塵の魔神","草神の前任者","カーンルイアの女王"], a: 1, e: "帰終は「塵の魔神」で、きわめて博学で聡明だったと考えられています。瓊璣野に都を構えたのち、モラクスの率いる璃月と合流して帰離原という一大都市を築きましたが、魔神戦争で戦死しました。帰終機の開発にも携わっています。", s: ["キャラ・一族・団体/璃月"] },
      { q: "モンドの「風龍廃墟」はかつて何と呼ばれていた？", o: ["風神の神殿","デカラビアンが支配する旧モンド","ドラゴンの巣","冒険者ギルド本部"], a: 1, e: "風龍廃墟は、かつて竜巻の魔神デカラビアンが建国・統治していた旧モンドです。デカラビアンは高壁と暴風の結界で都を封鎖し、人々に圧政を敷いていましたが、反乱によって打倒されました。", s: ["キャラ・一族・団体/モンド"] },
      { q: "500年前、狐斎宮が命と引き換えに「神櫻大祓」を行った目的は？", o: ["穢れを溜め、枯死しかけた神櫻を救うため","雷電将軍の力を封じるため","オロバシの祟りを鎮めるため","鎖国令を解くため"], a: 0, e: "500年前の大災害の際、鳴神大社の神櫻は穢れを溜め過ぎて枯死寸前になっていました。狐斎宮は神櫻大祓を敢行して神櫻の命を繋ぎ止めましたが、自身は漆黒に飲まれて命を落としました。このとき斎宮から溢れ出た穢れが残留思念に応じて人の形をとった存在が、花散里です。", s: ["キャラ・一族・団体/稲妻"] },
      { q: "「帰離原（きりはら）」の名前の由来は？", o: ["霧が多いため","帰終とモラクス（鍾離）の二人の名から","昔の国の名前","仙人の名前"], a: 1, e: "帰終は岩王帝君（モラクス）と親密だったため、両者の名前から一文字ずつ取って「帰離原」と名付けられました。モラクスが璃月の民を連れて帰終の都に合流し、大きくなった都市です。", s: ["用語集","年表"] },
      { q: "稲妻の「鶴観（つるみ）」を覆う霧の本当の起源は？", o: ["天から落ちてきた不思議な物体","雷鳥が民を守るために張った結界","雷神が鎖国のために起こした霧","アビス教団の結界"], a: 0, e: "鶴観の霧は、天から降ってきた不思議な物体が島に落ちたことで生じたものです。人々はこれを雷鳥が民を守るために作った霧だと誤解し、雷鳥を崇めました。のちに雷鳥と心を通わせた少年ルーが生贄にされると、怒り狂った雷鳥（ルーが名付けた「カンナ・カパッチリ」）は鶴観の民を滅ぼし、セイライ島へ飛び去りました。", s: ["キャラ・一族・団体/稲妻"] },

    extreme: [
      { q: "古代フォンテーヌに帝国「レムリア」を築いた、音楽を愛する神王は？", o: ["レムス","エゲリア","フォルトゥナ","ボエティウス"], a: 0, e: "神王レムスは、スメールのオアシス地帯にあった領域を失って流浪した末、地上大湖の領域で予言者シビラと出会い、レムリア帝国を築きました。滅びの運命を変えようと奔走しましたが、ボエティウスの裏切りもあって叶わず、レムスの死によって暴走した楽章の力でレムリアは水没しました。", s: ["キャラ・一族・団体/フォンテーヌ"] },
      { q: "ドラゴンスパインにかつて栄え、天から落ちた「釘」によって滅ぼされた古代文明は？", o: ["シャール・フィンドニール","白夜国","レムリア","帰離集"], a: 0, e: "ドラゴンスパインは、かつて「シャール・フィンドニール」という文明が栄えた土地でした。当初は緑豊かでしたが、天から「寒天の釘」が降り注いで山の頂部が破壊され、山全体が急速に寒冷化して、人々は死に絶えました。", s: ["キャラ・一族・団体/モンド"] },

    stats: data.stats || {},

}

// ── 汎用 ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 表示中の要素でCSSアニメーションを最初から再生し直す
function replayAnimation(el, animation) {
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = animation;
}

function showScreen(screen) {
  [$start, $quiz, $result].forEach(s => { s.style.display = s === screen ? 'block' : 'none'; });
}

// ── サウンド（Web Audio API） ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

// 1音を鳴らす。freqEnd で周波数をスライド、attack でフェードイン、
// linear で減衰を直線に（省略時は指数減衰）、dest 省略でスピーカー直結
function playTone({ type = 'sine', freq, freqEnd, at, dur, gain, attack = 0, linear = false, dest }) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, at);
  if (freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, at + dur);
  if (attack) {
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(gain, at + attack);
  } else {
    g.gain.setValueAtTime(gain, at);
  }
  g.gain[linear ? 'linearRampToValueAtTime' : 'exponentialRampToValueAtTime'](0.0001, at + dur);
  osc.connect(g).connect(dest || ctx.destination);
  osc.start(at);
  osc.stop(at + dur);
}

// 効果音: 音量設定を反映し、複数音を spacing 秒間隔で鳴らす
function playSE(notes, spacing = 0) {
  if (volumes.se <= 0) return;
  const now = getAudioCtx().currentTime;
  notes.forEach((n, i) => playTone({ ...n, at: now + i * spacing, gain: n.gain * volumes.se }));
}
const SE = {
  correct: () => playSE(
    [523.25, 659.25, 783.99].concat(combo >= 5 ? [1318.51] : []) // 5コンボ以上でキラッと一音追加
      .map(freq => ({ freq, dur: 0.4, gain: 0.18 })), 0.1),
  wrong:   () => playSE([{ type: 'square', freq: 200, freqEnd: 120, dur: 0.4, gain: 0.15 }]),
  click:   () => playSE([{ freq: 880, dur: 0.08, gain: 0.08 }]),
  fanfare: () => playSE([523.25, 659.25, 783.99, 1046.5].map(freq => ({ freq, dur: 0.6, gain: 0.15 })), 0.15),
};

// ── BGM（Web Audioによる自動生成・原神風アンビエント） ──
const bgmEngine = {
  gainNode: null, timer: null, scene: 'title', step: 0, nextNoteTime: 0,
  // Dメジャーペンタトニック（穏やかなファンタジー調）
  SCALE: [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25, 739.99, 880.00],
  CHORDS: [
    [146.83, 220.00, 293.66, 369.99],  // D
    [123.47, 185.00, 246.94, 293.66],  // Bm
    [98.00, 146.83, 196.00, 246.94],   // G
    [110.00, 164.81, 220.00, 277.18],  // A
  ],
  CFG: {
    title:  { bpm: 62, density: 0.40, high: 0 },
    quiz:   { bpm: 84, density: 0.60, high: 0 },
    result: { bpm: 72, density: 0.65, high: 1 },
  },
  setScene(scene) { this.scene = scene; this.ensure(); },
  // 音量設定に合わせて再生・停止・音量を揃える（AudioContextは初回のユーザー操作後に生成される）
  ensure() {
    if (volumes.bgm <= 0 || !audioCtx) { this.stop(); return; }
    if (!this.gainNode) { this.gainNode = audioCtx.createGain(); this.gainNode.connect(audioCtx.destination); }
    this.gainNode.gain.value = volumes.bgm * 0.5;
    if (this.timer) return;
    this.nextNoteTime = audioCtx.currentTime + 0.1;
    this.step = 0;
    this.timer = setInterval(() => this.schedule(), 120);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  schedule() {
    const cfg = this.CFG[this.scene] || this.CFG.title;
    const beat = 60 / cfg.bpm / 2; // 8分音符
    // バックグラウンドでタイマーが間引かれた後は、過去分を演奏せず現在時刻まで進める
    if (this.nextNoteTime < audioCtx.currentTime - 0.05) this.nextNoteTime = audioCtx.currentTime + 0.05;
    while (this.nextNoteTime < audioCtx.currentTime + 0.35) {
      const bar = Math.floor(this.step / 8) % this.CHORDS.length;
      if (this.step % 8 === 0) this.pad(this.CHORDS[bar], this.nextNoteTime, beat * 8);
      if (Math.random() < cfg.density) {
        let idx = Math.floor(Math.random() * this.SCALE.length);
        if (cfg.high && idx < 4) idx += 4;
        this.pluck(this.SCALE[idx], this.nextNoteTime);
      }
      this.step++;
      this.nextNoteTime += beat;
    }
  },
  pad(freqs, t, dur) {
    freqs.forEach(freq => playTone({ freq, at: t, dur, gain: 0.05, attack: dur * 0.3, linear: true, dest: this.gainNode }));
  },
  pluck(freq, t) {
    playTone({ type: 'triangle', freq, at: t, dur: 0.6, gain: 0.07, dest: this.gainNode });
  },
};

// ── 演出（画面フラッシュ・紙吹雪） ──
let flashTimeout = null;
function flashScreen(type) {
  const el = $('screen-flash');
  clearTimeout(flashTimeout);
  el.className = 'screen-flash ' + type;
  flashTimeout = setTimeout(() => { el.className = 'screen-flash'; }, 350);
}

// 紙吹雪。origin を渡すとその要素の位置から小さく散らし、省略時は画面上部から降らせる
function spawnConfetti({ count, colors, size, duration, life, origin }) {
  const c = document.createElement('div');
  c.className = 'confetti-container';
  document.body.appendChild(c);
  const rect = origin && origin.getBoundingClientRect();
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    if (rect) {
      p.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 100) + 'px';
      p.style.top = rect.top + 'px';
      p.style.borderRadius = '50%';
    } else {
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 1.5 + 's';
      p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    }
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (duration[0] + Math.random() * duration[1]) + 's';
    const s = (size[0] + Math.random() * size[1]) + 'px';
    p.style.width = s; p.style.height = s;
    c.appendChild(p);
  }
  setTimeout(() => c.remove(), life);
}
const confettiRain = () => spawnConfetti({
  count: 100, colors: ['#e2b44d', '#f5d88e', '#74c2a8', '#b08fc2', '#ef7938', '#4cc2f1', '#f87171', '#4ade80'],
  size: [4, 8], duration: [2, 3], life: 7000,
});
const confettiBurst = origin => spawnConfetti({
  count: 12, colors: ['#4ade80', '#e2b44d', '#f5d88e'], size: [3, 5], duration: [1, 1.5], life: 3000, origin,
});

function initParticles() {

}

// ── スタート画面（難易度・ジャンル・出題数） ──
function buildDifficultyUI() {
  const container = $('difficulty-options');
  const entries = DIFF_KEYS.map(k => [k, DIFFS[k].label]).concat([['all', '全難易度']]);
  entries.forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'diff-btn' + (key === selectedDifficulty ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      selectedDifficulty = key;
      container.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b === btn));
      updateExtremeUI();
      updatePoolCount();
    });
    container.appendChild(btn);
  });
}

function buildGenreUI() {
  const grid = $('genre-grid');
  const makeChip = (key, label, count) => {
    const chip = document.createElement('button');
    chip.className = 'genre-chip active';
    chip.innerHTML = label + (count === undefined ? '' : `<span class="chip-count">${count}</span>`);
    chip.addEventListener('click', () => toggleGenre(key));
    genreChips[key] = chip;
    grid.appendChild(chip);
  };
  makeChip('all', 'すべて');
  for (const [key, { label }] of Object.entries(GENRES)) makeChip(key, label, countQuestions(key, 'all'));
}

function buildCountUI() {
  const container = $('count-options');
  COUNT_CHOICES.forEach(({ label, value }) => {
    const btn = document.createElement('button');
    btn.className = 'count-btn';
    btn.textContent = label;
    btn.addEventListener('click', () => { questionCount = value; updateCountButtons(); });
    countBtns.push({ btn, value });
    container.appendChild(btn);
  });
}

// 出題数ボタンの選択状態を反映（超上級では10問以外を隠す）
function updateCountButtons() {
  const isExtreme = selectedDifficulty === 'extreme';
  countBtns.forEach(({ btn, value }) => {
    btn.style.display = isExtreme && value !== 10 ? 'none' : '';
    btn.classList.toggle('active', value === questionCount);
  });
}

function countQuestions(genre, diff) {
  return (diff === 'all' ? DIFF_KEYS : [diff]).reduce((t, d) => t + (quizData[genre][d]?.length || 0), 0);
}

function toggleGenre(key) {
  if (key === 'all') {
    const selectAll = !genreChips.all.classList.contains('active');
    selectedGenres = new Set(selectAll ? Object.keys(GENRES) : []);
  } else if (selectedGenres.has(key)) {
    selectedGenres.delete(key);
  } else {
    selectedGenres.add(key);
  }
  const allSelected = selectedGenres.size === Object.keys(GENRES).length;
  for (const [k, chip] of Object.entries(genreChips)) {
    chip.classList.toggle('active', k === 'all' ? allSelected : selectedGenres.has(k));
  }
  updatePoolCount();
}

function updateExtremeUI() {
  const isExtreme = selectedDifficulty === 'extreme';
  const isAll = selectedDifficulty === 'all';
  $('genre-section').style.display = isExtreme ? 'none' : '';
  $('extreme-warning').style.display = isExtreme || isAll ? 'block' : 'none';
  $('extreme-warning-box').innerHTML = isExtreme ? WARN_EXTREME : WARN_ALL;

  if (isExtreme) {
    if (preExtremeCount === null) preExtremeCount = questionCount;
    questionCount = 10;
  } else if (preExtremeCount !== null) {
    questionCount = preExtremeCount;
    preExtremeCount = null;
  }
  updateCountButtons();
}

function getPool() {
  const pool = [];
  // 超上級はジャンル選択を無視して全ジャンルから出題する
  const genres = selectedDifficulty === 'extreme' ? Object.keys(GENRES) : selectedGenres;
  const diffs = selectedDifficulty === 'all' ? DIFF_KEYS : [selectedDifficulty];
  for (const genre of genres) {
    for (const d of diffs) {
      (quizData[genre][d] || []).forEach(q => pool.push({ ...q, category: GENRES[genre].label, difficulty: d }));
    }
  }
  return pool;
}

function updatePoolCount() {
  const pool = getPool();
  $('pool-count').textContent = pool.length;
  $startBtn.disabled = pool.length === 0;
  renderStatsLine();
  for (const key of Object.keys(GENRES)) {
    genreChips[key].querySelector('.chip-count').textContent = countQuestions(key, selectedDifficulty);
  }
}

function renderStatsLine() {
  const el = $('stats-line');
  const st = saveData.stats[selectedDifficulty];
  if (!st || !st.plays) { el.textContent = ''; return; }
  const pct = Math.round(st.correct / st.answered * 100);
  el.innerHTML = '自己ベスト <span>' + st.best.score + '/' + st.best.total + '</span> ｜ プレイ <span>' + st.plays + '</span>回 ｜ 累計正答率 <span>' + pct + '%</span>';
}

// ── 制限時間（実時間ベース。バックグラウンドでのタイマー間引きの影響を受けない） ──
const timer = {
  id: null, duration: 0, deadline: 0, paused: null,
  start(seconds) {
    this.duration = seconds * 1000;
    $timerFill.classList.remove('warning');
    this.run(this.duration);
  },
  run(remainingMs) {
    this.stop();
    this.deadline = performance.now() + remainingMs;
    this.id = setInterval(() => this.tick(), 50);
    this.tick();
  },
  tick() {
    const remaining = this.deadline - performance.now();
    $timerFill.style.width = Math.max(0, remaining / this.duration * 100) + '%';
    if (remaining <= this.duration * 0.3) $timerFill.classList.add('warning');
    if (remaining <= 0) {
      this.stop();
      if (!answered) revealAnswer(null);
    }
  },
  stop() {
    clearInterval(this.id);
    this.id = null;
    this.paused = null;
  },
  // 設定パネルを開いている間の一時停止・再開
  pause() {
    if (!this.id) return;
    const remaining = Math.max(0, this.deadline - performance.now());
    this.stop();
    this.paused = remaining;
  },
  resume() {
    if (this.paused !== null) this.run(this.paused);
  },
};

// ── ゲーム進行 ──
function startGame() {
  SE.click();
  const pool = getPool();
  const count = Math.min(questionCount, pool.length);
  if (count === 0) return;

  // 未出題の問題を優先しつつ（直近の出題履歴を参照）、各グループ内の順序はランダムを保つ
  const fresh = [], seen = [];
  for (const q of shuffle(pool)) (saveData.recentQ.includes(q.q) ? seen : fresh).push(q);
  // 選択肢は毎回シャッフルし、正解番号を付け替える
  questions = fresh.concat(seen).slice(0, count).map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
  });
  currentQuestion = 0;
  score = 0;
  combo = 0;
  wrongAnswers = [];
  renderTally();
  $comboBadge.classList.remove('show');
  $('q-total').textContent = questions.length;

  showScreen($quiz);
  bgmEngine.setScene('quiz');
  showQuestion();
}

function returnToTitle() {
  SE.click();
  timer.stop();
  showScreen($start);
  bgmEngine.setScene('title');
}

function renderTally() {
  $('tally-correct').textContent = score;
  $('tally-wrong').textContent = wrongAnswers.length;
}

function showQuestion() {
  answered = false;
  const q = questions[currentQuestion];

  // 出題履歴に記録（実際に表示した問題のみ）
  saveData.recentQ = saveData.recentQ.filter(k => k !== q.q).concat(q.q).slice(-RECENT_LIMIT);
  persistSave();

  $('q-current').textContent = currentQuestion + 1;
  $('q-category').textContent = q.category;
  $('q-text').textContent = q.q;
  $progress.style.width = (currentQuestion / questions.length * 100) + '%';
  const badge = $('q-diff-badge');
  badge.textContent = DIFFS[q.difficulty].label;
  badge.className = 'question-difficulty-badge badge-' + q.difficulty;
  $explanation.style.display = 'none';
  $nextBtn.style.display = 'none';
  replayAnimation($card, 'fadeInUp 0.5s ease-out');

  $options.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${'ABCD'[i]}</span><span>${opt}</span>`;
    btn.style.animation = `fadeInUp ${0.3 + i * 0.08}s ease-out`;
    btn.addEventListener('click', () => { if (!answered) revealAnswer(i); });
    $options.appendChild(btn);
  });

  timer.start(DIFFS[q.difficulty].timer);
}

// 回答確定の共通処理（selectedIndex: 選択した選択肢の番号 / null = 時間切れ）
function revealAnswer(selectedIndex) {
  answered = true;
  timer.stop();
  const q = questions[currentQuestion];
  const buttons = $options.querySelectorAll('.option-btn');
  buttons.forEach((b, i) => {
    b.classList.add('disabled');
    if (i === q.a) b.classList.add('correct');
  });

  if (selectedIndex === q.a) {
    score++;
    combo++;
    confettiBurst(buttons[selectedIndex]);
    SE.correct();
    flashScreen('correct-flash');
  } else {
    combo = 0;
    if (selectedIndex !== null) buttons[selectedIndex].classList.add('wrong');
    wrongAnswers.push({
      n: currentQuestion + 1,
      q: q.q,
      correct: q.o[q.a],
      chosen: selectedIndex === null ? '時間切れ' : q.o[selectedIndex],
      e: q.e,
      s: q.s,
    });
    SE.wrong();
    flashScreen('wrong-flash');
    replayAnimation($card, 'shake 0.5s ease-in-out');
  }
  renderTally();

  $comboBadge.classList.toggle('show', combo >= 2);
  if (combo >= 2) {
    $comboBadge.textContent = combo + ' COMBO';
    replayAnimation($comboBadge, 'comboPop 0.3s ease-out');
  }

  $progress.style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
  $('exp-text').textContent = q.e;
  $('exp-src').innerHTML = sourceLinks(q.s);
  $explanation.style.display = 'block';
  $nextBtn.style.display = 'block';
  $nextBtn.textContent = currentQuestion < questions.length - 1 ? '次の問題 →' : '結果を見る →';
}

function nextQuestion() {
  SE.click();
  currentQuestion++;
  if (currentQuestion < questions.length) showQuestion();
  else showResult();
}

function showResult() {
  showScreen($result);
  const total = questions.length;
  const pct = score / total;

  $('result-score').textContent = score;
  $('result-total').textContent = total;
  $('stat-correct').textContent = score;
  $('stat-wrong').textContent = wrongAnswers.length;

  // 円グラフをリセットしてからアニメーション
  const circle = $('circle-fill');
  const circumference = 2 * Math.PI * 70;
  circle.style.transition = 'none';
  circle.style.strokeDashoffset = circumference;
  circle.getBoundingClientRect(); // SVG要素にoffsetHeightはないため、リフローはこちらで発生させる
  circle.style.transition = '';
  setTimeout(() => { circle.style.strokeDashoffset = circumference * (1 - pct); }, 100);

  const { rank, title, message } = RANKS.find(r => pct >= r.min);
  $('result-rank').textContent = rank;
  $('result-title').textContent = title;
  $('result-message').textContent = message;
  if (pct >= 0.8) { confettiRain(); SE.fanfare(); }
  bgmEngine.setScene('result');

  // 戦績の更新（難易度別）
  const st = saveData.stats[selectedDifficulty] || { best: null, plays: 0, correct: 0, answered: 0 };
  st.plays++;
  st.correct += score;
  st.answered += total;
  let newRecord = false;
  if (!st.best || pct > st.best.score / st.best.total) {
    newRecord = st.plays > 1;
    st.best = { score, total };
  }
  saveData.stats[selectedDifficulty] = st;
  persistSave();
  renderStatsLine();
  $('new-record').style.display = newRecord ? 'block' : 'none';

  // 間違えた問題の復習リスト
  const review = $('review-section');
  review.style.display = wrongAnswers.length ? 'block' : 'none';
  review.innerHTML = '<p class="review-title">間違えた問題をおさらい</p>' + wrongAnswers.map(w =>
    '<div class="review-item">' +
      '<p class="rv-q"><span class="rv-num">Q.' + w.n + '</span>' + w.q + '</p>' +
      '<p class="rv-a"><span class="rv-correct">正解: ' + w.correct + '</span><span class="rv-chosen">あなた: ' + w.chosen + '</span></p>' +
      '<p class="rv-e">' + w.e + '</p>' +
      '<p class="src-links">' + sourceLinks(w.s) + '</p>' +
    '</div>').join('');
}

// 出典はWikiのページ名、またはURL（Wiki以外のサイト）で持つ
function sourceLinks(sources) {
  return '出典：' + sources.map(s => {
    const [href, label] = s.startsWith('http') ? [s, new URL(s).hostname] : [WIKI_BASE + encodeURIComponent(s).replace(/%2F/g, '/'), '原神Wiki「' + s + '」'];
    return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
  }).join('、');
}

updatePoolCount();

[$startBtn, $('retry-btn')].forEach(btn => btn.addEventListener('click', startGame));
[$('back-btn'), $('quit-btn')].forEach(btn => btn.addEventListener('click', returnToTitle));
$nextBtn.addEventListener('click', nextQuestion);

$('settings-btn').addEventListener('click', openSettings);
$('settings-close').addEventListener('click', () => { SE.click(); closeSettings(); });
$settingsOverlay.addEventListener('click', e => { if (e.target === $settingsOverlay) closeSettings(); });
$bgmVol.addEventListener('input', () => {
  volumes.bgm = $bgmVol.value / 100;
  renderVolumeUI();
  bgmEngine.ensure();
  persistSave();
});
$seVol.addEventListener('input', () => {
  volumes.se = $seVol.value / 100;
  renderVolumeUI();
  persistSave();
});
$seVol.addEventListener('change', SE.click);

// キーボード操作（1〜4で回答 / Enter・Spaceで次へ / Escで設定を閉じる）
document.addEventListener('keydown', e => {
  if ($settingsOverlay.style.display === 'flex') {
    if (e.key === 'Escape') closeSettings();
    return;
  }
  if ($quiz.style.display !== 'block' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!answered && ['1', '2', '3', '4'].includes(e.key)) {
    const btn = $options.querySelectorAll('.option-btn')[Number(e.key) - 1];
    if (btn) btn.click();
  } else if (answered && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    nextQuestion();
  }
});

// 初回のユーザー操作でオーディオ開始（ブラウザの自動再生制限対策）
// タッチ端末では pointerdown 時点で再生許可が下りないため、
// AudioContext が running になるのを確認できるまでリスナーを解除しない
const AUDIO_UNLOCK_EVENTS = ['pointerup', 'keydown', 'click'];
function initAudioOnce() {
  const ctx = getAudioCtx();
  const finish = () => {
    if (ctx.state !== 'running') return;
    AUDIO_UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, initAudioOnce));
    bgmEngine.ensure();
  };
  if (ctx.state === 'suspended') ctx.resume().then(finish).catch(() => {});
  else finish();
}
AUDIO_UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, initAudioOnce));

// タブが裏に回ったらBGMを一時停止し、戻ったら再開する（間引きによる断続再生の防止）
document.addEventListener('visibilitychange', () => {
  if (document.hidden) bgmEngine.stop();
  else bgmEngine.ensure();
});
</script>
</body>
</html>
